<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>40kPlayer</title>
<style>
  :root { --bg:#1e1f22; --panel:#2a2c30; --ink:#e8e6e1; --muted:#9a9890; --att:#c83c3c; --def:#3c6ec8; --accent:#f2c744; --ok:#4caf50; --err:#ff6b6b; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; display:flex; justify-content:center; height:100vh; overflow:hidden; }
  #boardwrap { flex: 0 0 auto; display:flex; align-items:center; justify-content:center; padding:8px; background:#161719; position:relative; }
  canvas { display:block; background:#e8e4da; border-radius:4px; cursor:default; touch-action:none; }
  #zoombar { position:absolute; right:14px; bottom:14px; display:flex; flex-direction:column; gap:4px; }
  #zoombar button { width:34px; height:34px; padding:0; font-size:18px; background:rgba(40,42,46,0.85); }
  #feed { position:absolute; left:16px; top:16px; max-width:min(460px, 70%); display:flex; flex-direction:column; gap:4px; pointer-events:none; }
  #feed div { background:rgba(20,20,22,0.86); color:#f3efe6; border-left:4px solid var(--accent); padding:5px 8px; border-radius:4px; font-size:12.5px; transition:opacity .8s; white-space:pre-wrap; }
  #feed div.att { border-left-color:var(--att); } #feed div.def { border-left-color:var(--def); }
  #feed div.fade { opacity:0; }
  #replaybar { position:absolute; left:50%; transform:translateX(-50%); bottom:16px; background:rgba(20,20,22,0.9); color:#fff; padding:6px 10px; border-radius:6px; display:none; gap:8px; align-items:center; font-size:13px; max-width:90%; }
  #replaybar.open { display:flex; }
  #side { flex:1 1 auto; display:flex; flex-direction:column; min-width:380px; max-width:560px; height:100vh; }
  #status { padding:10px 14px; background:var(--panel); border-bottom:1px solid #000; }
  #status h1 { margin:0 0 4px; font-size:16px; font-weight:600; }
  .score { display:flex; gap:14px; font-size:15px; align-items:center; flex-wrap:wrap; }
  .score b.att { color:#ff8a8a; } .score b.def { color:#8ab4ff; }
  #status, #decision, #unitinfo { flex:0 0 auto; }
  #settings { display:none; padding:8px 14px; background:#26282c; border-bottom:1px solid #000; font-size:12.5px; color:var(--muted); }
  #settings.open { display:flex; flex-wrap:wrap; gap:6px 16px; }
  #settings label { display:flex; align-items:center; gap:5px; cursor:pointer; }
  #decision { padding:12px 14px; background:#232529; border-bottom:1px solid #000; min-height:150px; max-height:45vh; overflow:auto; }
  #decision h2 { margin:0 0 6px; font-size:15px; color:var(--accent); }
  #decision .hint { color:var(--muted); font-size:13px; margin-bottom:8px; }
  #decision .observe { color:#f0d9a0; font-size:14px; margin-bottom:8px; white-space:pre-wrap; }
  .btns { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  button { background:#3a3d44; color:var(--ink); border:1px solid #555; border-radius:6px; padding:6px 10px; cursor:pointer; font-size:13px; }
  button:hover { background:#4a4e57; }
  button.primary { background:#2f6b3a; border-color:#3f8f4f; }
  button.primary:hover { background:#38804a; }
  button.warn { background:#6b3a2f; border-color:#8f4f3f; }
  button.strat { background:#3d3170; border-color:#6a58b8; }
  button.strat:hover { background:#4a3c88; }
  button.active { outline:2px solid var(--accent); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  button .k { color:var(--muted); font-size:11px; margin-left:4px; }
  #error { color:var(--err); margin-top:6px; min-height:18px; font-size:13px; }
  #extra { color:var(--muted); font-size:12.5px; margin-top:6px; white-space:pre-wrap; }
  #extra .bad, #unitinfo .bad { color:var(--err); } #extra .good { color:#9be09b; }
  #unitinfo { padding:10px 14px; font-size:13px; color:var(--muted); border-bottom:1px solid #000; min-height:70px; max-height:34vh; overflow:auto; }
  #unitinfo b { color:var(--ink); }
  #unitinfo table { border-collapse:collapse; margin:4px 0; font-size:12px; width:100%; }
  #unitinfo th { text-align:left; color:var(--muted); font-weight:500; border-bottom:1px solid #444; padding:2px 4px; }
  #unitinfo td { border-bottom:1px solid #333; padding:2px 4px; color:var(--ink); }
  #unitinfo details { margin:2px 0; } #unitinfo summary { cursor:pointer; color:var(--ink); }
  #log { flex:1 1 auto; min-height:0; overflow:auto; padding:8px 14px; font: 12.5px/1.45 ui-monospace, Menlo, Consolas, monospace; background:#1a1b1e; }
  #log div { white-space:pre-wrap; }
  #log .round { color:var(--accent); font-weight:700; margin-top:6px; }
  #log .score { color:#9be09b; }
  #log .combat { color:#f0b090; }
  #log .strat { color:#c6b5ff; font-weight:600; }
  #log .detail { color:#77787a; }
  #log .err { color:var(--err); }
  .pill { display:inline-block; padding:1px 7px; border-radius:10px; font-size:12px; background:#444; margin-left:6px; }
  .pill.att { background:var(--att); } .pill.def { background:var(--def); }
  kbd { background:#444; border-radius:3px; padding:0 4px; font-size:12px; }
  #topbar { display:flex; gap:6px; align-items:center; float:right; flex-wrap:wrap; justify-content:flex-end; }
  #topbar a, #topbar button { font-size:12px; padding:3px 8px; }
  a.btnlink { color:var(--ink); text-decoration:none; background:#3a3d44; border:1px solid #555; border-radius:6px; }
  a.btnlink:hover { background:#4a4e57; }
  #banner, #absence { display:none; padding:8px 14px; background:#5a4a1a; color:#fff3c8; font-size:13px; border-bottom:1px solid #000; }
  #absence { background:#24405c; color:#dbe9ff; }
  #banner.open, #absence.open { display:block; }
  #banner button, #absence button { font-size:12px; padding:1px 7px; margin-left:6px; }
  #absence .list { max-height:22vh; overflow:auto; margin-top:6px; font-size:12px; color:#c6d8f2; }
  #history { display:none; flex:0 0 auto; max-height:32vh; overflow:auto; background:#202226; border-bottom:1px solid #000; padding:6px 10px; font-size:12.5px; }
  #history.open { display:block; }
  #history .h { display:flex; gap:6px; align-items:center; padding:2px 0; border-bottom:1px solid #2c2e33; }
  #history .h .i { color:var(--muted); width:34px; text-align:right; flex:0 0 auto; }
  #history .h .w { color:var(--muted); width:118px; flex:0 0 auto; }
  #history .h .l { flex:1 1 auto; }
  #history .h .l.att { color:#ffb0b0; } #history .h .l.def { color:#b0c8ff; }
  #history .h .l.bot, #history .h .l.auto { font-style:italic; }
  #history .h button { font-size:11px; padding:1px 6px; }
  #history .h button.confirm { background:#8f3f2f; border-color:#c05a45; }
  #history .head { display:flex; justify-content:space-between; align-items:center; color:var(--accent); margin-bottom:4px; }
  @media (max-width: 900px) {
    body { flex-direction:column; height:auto; overflow:auto; }
    #boardwrap { padding:4px; }
    #side { min-width:0; max-width:none; height:auto; }
    #decision { max-height:none; }
    #log { max-height:40vh; }
    #unitinfo { max-height:none; }
    button { padding:8px 12px; font-size:14px; }
  }
</style>
</head>
<body>
<div id="boardwrap"><canvas id="board"></canvas>
  <div id="feed"></div>
  <div id="replaybar"><span id="replaytext"></span><button id="replaystop">Passer</button></div>
  <div id="zoombar"><button id="zin" title="Zoomer (molette, pincement)">+</button><button id="zout" title="Dézoomer">−</button><button id="zreset" title="Tout le plateau">⤢</button></div>
</div>
<div id="side">
  <div id="status">
    <div id="topbar"><button id="undobtn" title="Annuler la dernière action d’un joueur (Ctrl/Cmd + Z)">↶ Annuler</button><button id="histbtn">Historique</button><button id="setbtn" title="Réglages">Réglages</button><button id="delbtn" class="warn" title="Supprimer la partie pour les deux joueurs">Supprimer</button><a class="btnlink" id="homebtn" href="/">Accueil</a></div>
    <h1 id="title">40kPlayer</h1>
    <div class="score"><span>Round <b id="round">–</b></span><span>Phase <b id="phase">–</b></span><span id="turn"></span></div>
    <div class="score"><span><span id="nameA">Attaquant</span> <b class="att" id="scoreA">0</b> VP · <b class="att" id="cpA">0</b> CP</span><span><span id="nameD">Défenseur</span> <b class="def" id="scoreD">0</b> VP · <b class="def" id="cpD">0</b> CP</span></div>
  </div>
  <div id="settings">
    <label title="Combat avec une seule option, tir vers la seule cible possible, serment à cible unique : joués d’office"><input type="checkbox" id="s_auto"> actions automatiques</label>
    <label title="Le moteur place tes unités restantes dans ta zone"><input type="checkbox" id="s_deploy"> déploiement automatique</label>
    <label id="steplabel"><input type="checkbox" id="s_step"> pas à pas (valider chaque action du bot)</label>
    <label title="Notification du navigateur quand c’est à toi"><input type="checkbox" id="s_notify"> notifications</label>
    <label title="Te proposer les stratagèmes utilisables (Fire Overwatch, Command Re-roll…) ; décoché : la partie passe sans demander"><input type="checkbox" id="s_strat"> stratagèmes</label>
    <label><input type="checkbox" id="s_sound"> son</label>
    <label><input type="checkbox" id="s_anim"> animations</label>
    <span>Raccourcis : <kbd>Entrée</kbd> valider · <kbd>S</kbd> immobile · <kbd>A</kbd> Advance · <kbd>N</kbd> unité suivante · <kbd>E</kbd> fin de phase · <kbd>R</kbd> pivoter · <kbd>I</kbd> fiche · <kbd>1</kbd>…<kbd>9</kbd> stratagème · <kbd>Ctrl</kbd>+<kbd>Z</kbd> annuler</span>
  </div>
  <div id="banner"></div>
  <div id="absence"></div>
  <div id="history"></div>
  <div id="decision"><h2 id="dtitle">Connexion…</h2><div class="observe" id="dobs"></div><div class="hint" id="dhint"></div><div class="btns" id="dbtns"></div><div id="extra"></div><div id="error"></div></div>
  <div id="unitinfo"></div>
  <div id="log"></div>
</div>
<script>
(() => {
const canvas = document.getElementById('board');
const ctx = canvas.getContext('2d');
const $ = id => document.getElementById(id);
const esc = t => String(t == null ? '' : t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let layout = null, S = null, logLen = 0, lastVersion = -1;
const GID = location.pathname.split('/').filter(Boolean)[1];
const TOKEN = new URLSearchParams(location.search).get('t') || '';
const API = '/api/g/' + GID;
const TQ = TOKEN ? 't=' + encodeURIComponent(TOKEN) : '';
const withT = (url) => url + (TQ ? (url.includes('?') ? '&' : '?') + TQ : '');
const view = { timeline: null, seenUndo: null, historyOpen: false, history: [], historyKey: null, confirmAt: null, error: '',
               wasMyTurn: false, detailsUnit: null, details: {}, anim: null, replay: null, absenceShown: false };
let scale = 12, margin = 22, zoom = 1, panX = 0, panY = 0, K = 12;
const local = { decisionKey: null, pos: {}, orig: {}, kind: 'normal', dragging: null, dragStart: null, shift: false, hover: null, sending: false,
                selected: new Set(), band: null, pseudo: null, carry: null, wholeUnit: false, check: null, checkSeq: 0, checkTimer: null };
const prefs = {
  get(k, d) { try { const v = localStorage.getItem('fortyk.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('fortyk.' + k, JSON.stringify(v)); } catch (e) { /* stockage indisponible */ } },
};

const HELP = 'Glisse une de tes unités pour la déplacer (plus besoin de la choisir d’abord). Encadre plusieurs figurines pour les bouger ensemble, <kbd>Maj</kbd> + glisser (ou « toute l’unité ») déplace toute l’unité, <kbd>R</kbd> / <kbd>Maj</kbd>+<kbd>R</kbd> pivote une coque, <kbd>Échap</kbd> annule le glissement. Clic sur une unité (ou <kbd>I</kbd> en survol) : sa fiche. Molette ou pincement : zoom ; glisser le fond du plateau : se déplacer.';
const SIDE_FR = { attacker: 'attaquant', defender: 'défenseur' };
const PHASE_FR = { deployment: 'déploiement', scouts: 'scouts', command: 'commandement', movement: 'mouvement', shooting: 'tir', charge: 'charge', fight: 'combat', end_turn: 'fin de tour', end_battle: 'fin de bataille' };
const COL = { attacker: '#c83c3c', defender: '#3c6ec8' };

// ------------------------------------------------------------ réseau
async function getJSON(url) { const r = await fetch(url); return r.json(); }
async function postJSON(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  return r.json();
}
async function send(payload) {
  if (local.sending) return;
  local.sending = true;
  try {
    const res = await postJSON(withT(API + '/action'), payload);
    if (!res.ok) { view.error = res.error || 'refusé'; $('error').textContent = view.error; }
    else markSeen();
  } finally { local.sending = false; }
}
async function undo(to) {
  const res = await postJSON(withT(API + '/undo'), { to: to === undefined ? null : to });
  if (!res.ok) { view.error = res.error || 'annulation refusée'; $('error').textContent = view.error; }
  view.confirmAt = null;
}
async function saveSettings(values) {
  const res = await postJSON(withT(API + '/settings'), values);
  if (!res.ok) { view.error = res.error || 'réglage refusé'; $('error').textContent = view.error; }
}

// long-polling : le serveur répond dès que la partie change (ou au bout de 25 s)
async function poll() {
  let delay = 0;
  try {
    const wait = lastVersion >= 0 && view.timeline !== null ? `&wait=${lastVersion}` : '';
    const st = await getJSON(withT(API + '/state?since=' + logLen + wait));
    if (st.ok === false) { gameGone(st); return; }
    if (st.waiting) { view.wasWaiting = true; renderWaiting(st); setTimeout(poll, 2000); return; }
    if (view.wasWaiting) { location.reload(); return; }  // l'adversaire vient de rejoindre : on repart d'un état propre
    if (view.timeline !== null && st.timeline !== view.timeline && logLen > 0) {
      // une annulation a réécrit l'histoire : on repart du journal complet
      view.timeline = st.timeline; logLen = 0; $('log').innerHTML = ''; lastVersion = -1; view.anim = null;
      setTimeout(poll, 0); return;
    }
    view.timeline = st.timeline;
    if (st.version !== lastVersion) {
      const prev = S;
      lastVersion = st.version;
      S = st;
      view.error = '';
      appendLog(st.log, st.log_since, prev !== null);
      startAnimation(prev, st);
      onNewState();
      render();
    }
  } catch (e) {
    if (!(e instanceof TypeError && String(e).includes('fetch'))) console.error(e);
    delay = 1500;  // serveur indisponible : on réessaie
  }
  setTimeout(poll, delay);
}

// ------------------------------------------------------------ état → UI
function unitById(id) { return S.units.find(u => u.id === id); }
function humanTurn() { return S && S.pending && S.pending.side === S.human_side && !S.game_over; }
const PLACING_KINDS = new Set(['deploy', 'move', 'advance_move', 'charge_move', 'scout', 'disembark']);
function directMovePhase() { const p = S && S.pending; return humanTurn() && p.kind === 'select_unit' && p.phase === 'movement'; }
function selectableIds() {
  const p = S.pending; if (!humanTurn()) return new Set();
  if (p.kind === 'select_unit') return new Set(p.options.filter(o => o.unit_id && !o.embarked_in && !o.stratagem).map(o => o.unit_id));
  if (p.kind === 'stratagem') return new Set(p.options.filter(o => o.unit_id).map(o => o.unit_id));
  return new Set();
}
// contexte de placement : décision en cours du moteur, ou mouvement direct d'une unité (« quelle unité ? » sauté)
function place() {
  if (!humanTurn() || view.replay) return null;
  const p = S.pending;
  if (p.unit_id && PLACING_KINDS.has(p.kind)) return { uid: p.unit_id, kind: p.kind, maxd: p.max_distance, pseudo: false };
  if (local.pseudo && directMovePhase()) { const u = unitById(local.pseudo); return u ? { uid: u.id, kind: 'move', maxd: u.move, pseudo: true } : null; }
  return null;
}
function isPlacing() { return place() !== null; }

function initPlacement(pl) {
  local.pos = {}; local.orig = {}; local.kind = 'normal'; local.selected = new Set(); local.dragging = null; local.band = null; local.check = null;
  if (!pl) return;
  const p = S.pending, u = unitById(pl.uid);
  const alive = u.models.filter(m => m.alive);
  if (pl.kind === 'deploy') {
    const z = layout.deployment_zones[u.side];
    let cx = z.reduce((a, v) => a + v[0], 0) / z.length, cy = z.reduce((a, v) => a + v[1], 0) / z.length;
    const cands = p.options.filter(o => o.x !== undefined);  // parmi les positions légales proposées, la plus proche du centre
    if (cands.length) { const best = cands.reduce((a, o) => Math.hypot(o.x - cx, o.y - cy) < Math.hypot(a.x - cx, a.y - cy) ? o : a); cx = best.x; cy = best.y; }
    const mx = alive.reduce((a, m) => a + m.x, 0) / alive.length, my = alive.reduce((a, m) => a + m.y, 0) / alive.length;
    alive.forEach(m => { local.pos[m.id] = withAngle(m, [cx + m.x - mx, cy + m.y - my]); });
    alive.forEach(m => { local.orig[m.id] = [...local.pos[m.id]]; });
  } else if (pl.kind === 'disembark') {
    local.proposal = 0; applyProposal(u, 0);
  } else {
    alive.forEach(m => { local.pos[m.id] = withAngle(m, [m.x, m.y]); local.orig[m.id] = [...local.pos[m.id]]; });
    // Advance déclarée depuis un mouvement direct : on garde le placement déjà glissé
    if (pl.kind === 'advance_move' && local.carry && local.carry.uid === pl.uid) Object.assign(local.pos, local.carry.pos);
  }
  local.carry = null;
  if (pl.kind === 'advance_move') local.kind = 'advance_move';
  if (pl.kind === 'charge_move') local.kind = 'charge';
}

function onNewState() {
  const p = S.pending;
  if (local.hover) {  // l'objet survolé vient de l'instantané précédent : on le relit dans le nouveau
    const hu = unitById(local.hover.u.id); const hm = hu && hu.models.find(q => q.id === local.hover.m.id);
    local.hover = hm && hm.alive && (hu.deployed || (p && p.unit_id === hu.id)) ? { u: hu, m: hm } : null;
  }
  if (local.pseudo && !(directMovePhase() && selectableIds().has(local.pseudo))) local.pseudo = null;
  const pl = place();
  const key = p ? [p.kind, p.unit_id, S.battle_round, S.phase, S.log_length, pl ? pl.uid : ''].join('|') : null;
  if (key !== local.decisionKey) { local.decisionKey = key; initPlacement(pl); }
  const st = S.settings || {};
  $('s_auto').checked = !!st.auto_actions; $('s_deploy').checked = !!st.auto_deploy; $('s_step').checked = !!st.step_mode; $('s_strat').checked = st.stratagems !== false;
  renderStatus(); renderDecision(); renderBanner(); refreshHistory(); renderUnitInfo();
  rememberGame(); notifyTurn(); checkAbsence();
  if (document.visibilityState === 'visible') markSeen();
}

// ------------------------------------------------------------ empreintes (rond, ovale, coque)
// Une empreinte = cœur rectangulaire (demi-côtés hx, hy, orienté par a) dilaté du rayon r :
// socle rond (hx = hy = 0), ovale (hy = 0), coque de véhicule (r = 0).
const isRound = m => !(m.hx > 0 || m.hy > 0);
function withAngle(m, xy) { return isRound(m) ? xy : [xy[0], xy[1], m.a || 0]; }
function livePose(u, m) {
  if (view.replay && view.replay.pos[m.id]) return view.replay.pos[m.id];
  const pl = place();
  if (pl && pl.uid === u.id && local.pos[m.id]) { const p = local.pos[m.id]; return [p[0], p[1], p.length > 2 ? p[2] : (m.a || 0)]; }
  const a = view.anim && view.anim.from[m.id];
  if (a) {
    const t = Math.min(1, (performance.now() - view.anim.t0) / view.anim.dur), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
    return [a[0] + (m.x - a[0]) * e, a[1] + (m.y - a[1]) * e, (a[2] || 0) + angDelta(a[2] || 0, m.a || 0) * e];
  }
  return [m.x, m.y, m.a || 0];
}
const poseOf = livePose;
function modelPos(u, m) { const q = livePose(u, m); return [q[0], q[1]]; }
function shapePath(m, x, y, a, grow) {
  const R = (m.r + (grow || 0)) * K;
  ctx.beginPath();
  if (isRound(m)) { ctx.arc(X(x), Y(y), Math.max(R, 0.5), 0, Math.PI * 2); return; }
  const hx = m.hx * K, hy = m.hy * K, c = Math.cos(a), s = Math.sin(a);
  const P = (lx, ly) => [X(x) + lx * c - ly * s, Y(y) + lx * s + ly * c];
  const corners = [[hx, hy, 0], [-hx, hy, Math.PI / 2], [-hx, -hy, Math.PI], [hx, -hy, 1.5 * Math.PI]];
  let first = true;
  corners.forEach(([cx, cy, a0]) => {
    const steps = R > 0 ? 6 : 0;
    for (let k = 0; k <= steps; k++) {
      const t = a0 + (steps ? k / steps : 0) * Math.PI / 2;
      const [px, py] = P(cx + R * Math.cos(t), cy + R * Math.sin(t));
      if (first) { ctx.moveTo(px, py); first = false; } else ctx.lineTo(px, py);
    }
  });
  ctx.closePath();
}
function inShape(m, x, y, a, bx, by, tol) {
  const dx = bx - x, dy = by - y, c = Math.cos(a), s = Math.sin(a);
  const lx = dx * c + dy * s, ly = -dx * s + dy * c;
  return Math.hypot(Math.max(Math.abs(lx) - (m.hx || 0), 0), Math.max(Math.abs(ly) - (m.hy || 0), 0)) <= m.r + tol;
}
function innerSize(m) { return m.r + (m.hy || 0); }
function angDelta(a0, a1) { const d = a1 - a0; return Math.atan2(Math.sin(d), Math.cos(d)); }
function moveDist(m, o, n) { return Math.hypot(n[0] - o[0], n[1] - o[1]); }  // V11 (03.01) : pivoter ne compte pas

// débarquement : placements proposés par le moteur (couronnes autour de la coque, formations)
function disembarkProposals() { return (S.pending.options || []).filter(o => o.disembark && !o.stay); }
function applyProposal(u, k) {
  const props = disembarkProposals(); const alive = u.models.filter(m => m.alive);
  if (!props.length) {
    const t = unitById(S.pending.target_id).models.find(m => m.alive) || unitById(S.pending.target_id).models[0];
    const mx = alive.reduce((a, m) => a + m.x, 0) / alive.length, my = alive.reduce((a, m) => a + m.y, 0) / alive.length;
    const off = (t.hx || 0) + (t.hy || 0) + t.r + 1.5;
    alive.forEach(m => { local.pos[m.id] = withAngle(m, [t.x + m.x - mx, t.y + off + m.y - my]); local.orig[m.id] = [...local.pos[m.id]]; });
    return;
  }
  const o = props[k % props.length];
  if (o.positions) alive.forEach(m => { local.pos[m.id] = withAngle(m, o.positions[m.id]); });
  else { const mx = alive.reduce((a, m) => a + m.x, 0) / alive.length, my = alive.reduce((a, m) => a + m.y, 0) / alive.length; alive.forEach(m => { local.pos[m.id] = withAngle(m, [o.x + m.x - mx, o.y + m.y - my]); }); }
  alive.forEach(m => { local.orig[m.id] = [...local.pos[m.id]]; });
}

function renderStatus() {

  $('phase').textContent = PHASE_FR[S.phase] || S.phase;
  $('scoreA').textContent = S.scores.attacker; $('scoreD').textContent = S.scores.defender;
  if (S.cp) { $('cpA').textContent = S.cp.attacker; $('cpD').textContent = S.cp.defender; }
  const me = S.human_side;
  const P = S.players || {};
  $('nameA').textContent = P.attacker ? `${P.attacker.name}${P.attacker.kind === 'bot' ? ' (bot)' : ''} — attaquant` : 'Attaquant';
  $('nameD').textContent = P.defender ? `${P.defender.name}${P.defender.kind === 'bot' ? ' (bot)' : ''} — défenseur` : 'Défenseur';
  const title = esc((S.game && S.game.title) || '40kPlayer');
  if (me) {
    const fac = (S.factions && S.factions[me]) || '';
    $('title').innerHTML = `${title} <span class="pill ${me === 'attacker' ? 'att' : 'def'}">tu joues ${SIDE_FR[me]}${fac ? ' — ' + esc(fac) : ''}</span>`;
  } else $('title').innerHTML = `${title} <span class="pill">spectateur</span>`;

}

function btn(label, onclick, cls, key) {
  const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls; b.onclick = onclick;
  if (key) { b.dataset.key = key; const k = document.createElement('span'); k.className = 'k'; k.textContent = key; b.appendChild(k); }
  return b;
}
function moveKindForSend(u) { return u.flags.engaged ? (u.flags.battle_shocked ? 'desperate' : 'fall_back') : (local.kind === 'advance_move' ? 'advance_move' : 'normal'); }
function expectTxt(o) { return o.expected_damage !== undefined ? ` — ~${o.expected_damage} dégâts` + (o.expected_models >= 0.1 ? `, ~${o.expected_models} fig.` : '') : ''; }
function autoDeployButton(box) {
  if (S.phase === 'deployment' && S.settings && !S.settings.auto_deploy) box.appendChild(btn('Déployer automatiquement mes unités restantes', () => saveSettings({ auto_deploy: true })));

function placementTools(box, u) {

}

function renderDecision() {

    p.options.forEach(o => box.appendChild(btn(o.label, () => send({ type: 'option', index: o.index }))));

function updateMoveExtra() {
  const pl = place(); if (!pl) return;
  const lines = [];
  const u = unitById(pl.uid);
  if (pl.maxd && pl.kind !== 'disembark' && pl.kind !== 'deploy') {
    for (const [mid, o] of Object.entries(local.orig)) {
      const m = u.models.find(q => q.id === mid); const n = local.pos[mid]; const d = moveDist(m, o, n);
      if (d > 0.05) lines.push(`${mid} : ${d.toFixed(1)}" / ${pl.maxd}"` + (d > pl.maxd + 1e-6 ? ' — trop loin' : ''));
    }
  }
  const c = local.check;
  let html = lines.length ? lines.map(l => l.includes('trop loin') ? `<span class="bad">${l}</span>` : l).join('<br>') : (pl.kind === 'deploy' ? '' : 'Aucune figurine déplacée.');
  if (c && !c.pending) html = (c.ok ? '<span class="good">✓ placement légal</span>' : `<span class="bad">✗ ${esc(c.error)}</span>`) + (html ? '<br>' + html : '');
  $('extra').innerHTML = html;
}

// ------------------------------------------------------------ vérification en direct (dry-run côté serveur)
function currentPayload() {
  const pl = place(); if (!pl) return null;
  const u = unitById(pl.uid);
  if (pl.kind === 'deploy') return { type: 'deploy_models', unit_id: u.id, positions: local.pos };
  if (pl.kind === 'disembark') return { type: 'disembark_models', unit_id: u.id, positions: local.pos };
  if (pl.kind === 'charge_move') return { type: 'model_move', unit_id: u.id, kind: 'charge', positions: local.pos };
  if (pl.kind === 'scout') return { type: 'model_move', unit_id: u.id, kind: 'scout', positions: local.pos };
  if (pl.kind === 'advance_move') return { type: 'model_move', unit_id: u.id, kind: 'advance_move', positions: local.pos };
  return { type: 'model_move', unit_id: u.id, kind: moveKindForSend(u), positions: local.pos };
}
function scheduleCheck() {
  clearTimeout(local.checkTimer);
  local.checkTimer = setTimeout(async () => {
    const pl = place(); const payload = currentPayload(); if (!pl || !payload) return;
    const moved = Object.entries(local.orig).some(([k, o]) => moveDist(null, o, local.pos[k]) > 0.02) || pl.kind === 'deploy' || pl.kind === 'disembark';
    if (!moved) { local.check = null; updateMoveExtra(); render(); return; }
    const seq = ++local.checkSeq;
    try {
      const res = await postJSON(withT(API + '/check'), payload);
      if (seq !== local.checkSeq) return;  // réponse périmée : une vérification plus récente est partie
      local.check = res; updateMoveExtra(); render();
    } catch (e) { /* hors ligne : on validera au clic */ }
  }, 140);
}

function hasMoved() { return Object.entries(local.orig).some(([k, o]) => local.pos[k] && (moveDist(null, o, local.pos[k]) > 0.02 || (o.length > 2 && Math.abs(angDelta(o[2], local.pos[k][2])) > 0.01))); }
function resetLocal() { for (const k in local.orig) local.pos[k] = [...local.orig[k]]; local.selected = new Set(); local.check = null; render(); updateMoveExtra(); }

// ------------------------------------------------------------ journal et fil d'événements
function lineClass(line) {
  if (line.startsWith('=====')) return 'round';
  if (line.startsWith('Score') || line.startsWith('Fin de bataille') || line.startsWith('RÉSULTAT')) return 'score';
  if (line.startsWith('Tir') || line.startsWith('Combat') || line.startsWith('Charge')) return 'combat';
  if (line.startsWith('Stratagème')) return 'strat';
  if (line.startsWith('      ')) return 'detail';
  if (line.startsWith('ERREUR')) return 'err';

// clic (sans glissement) sur le plateau : sélection, cible, ou fiche d'unité
function boardClick(px, py) {
  if (!S || view.replay) return;
  const hit = modelAt(px, py, null);
  if (!hit) return;
  const p = S.pending;
  if (humanTurn()) {
    if (p.kind === 'stratagem') {
      const opts = p.options.filter(o => o.stratagem && (o.unit_id === hit.u.id || o.target_id === hit.u.id));
      if (opts.length === 1) { send({ type: 'option', index: opts[0].index }); return; }
      if (opts.length > 1) { $('error').textContent = 'Plusieurs utilisations possibles avec cette unité : choisis avec les boutons.'; }
    }
    if (p.kind === 'select_unit' && hit.u.side === S.human_side) {
      const opt = p.options.find(o => o.unit_id === hit.u.id && !o.stratagem);
      if (opt && p.phase === 'movement' && !opt.embarked_in) { showDetails(hit.u.id); return; }  // déjà prise en main (mouvement direct)
      if (opt) { send({ type: 'select_unit', unit_id: hit.u.id }); return; }
      const why = p.ineligible && p.ineligible[hit.u.id];
      $('error').textContent = why ? `${hit.u.name} [${hit.u.id}] : ${why.reason}` : `${hit.u.name} [${hit.u.id}] a déjà été activée.`;
      showDetails(hit.u.id); return;
    }
    if ((p.kind === 'shoot' || p.kind === 'charge_target' || p.kind === 'oath' || p.kind === 'fight') && hit.u.side !== S.human_side) {
      const opts = p.options.filter(o => o.target_id === hit.u.id);
      if (opts.length === 1) { send({ type: 'option', index: opts[0].index }); return; }
      if (opts.length > 1) { $('error').textContent = 'Plusieurs unités peuvent frapper cette cible : utilise les boutons.'; return; }
      $('error').textContent = `${hit.u.name} [${hit.u.id}] n’est pas une cible possible ici.`;
    }
  }
  showDetails(hit.u.id);
}

// ------------------------------------------------------------ clavier
function clickKey(key) { const b = [...$('dbtns').querySelectorAll('button')].find(x => x.dataset.key === key); if (b) { b.click(); return true; } return false; }
function nextUnit() {
  if (!humanTurn() || S.pending.kind !== 'select_unit') return;
  const ids = S.pending.options.filter(o => o.unit_id && !o.embarked_in && !o.stratagem).map(o => o.unit_id);
  if (!ids.length) return;
  if (directMovePhase()) {
    const i = local.pseudo ? ids.indexOf(local.pseudo) : -1;
    local.pseudo = ids[(i + 1) % ids.length]; local.decisionKey = null; onNewState(); render();
  } else send({ type: 'select_unit', unit_id: ids[0] });
}
window.addEventListener('keydown', e => {
  const typing = ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName);
  if ((e.ctrlKey || e.metaKey) && (e.key === 'z' || e.key === 'Z') && S && S.human_side && !typing) { e.preventDefault(); if (S.can_undo) undo(); return; }
  if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === 'Escape') {
    if (local.dragging && local.dragStart) { local.pos = local.dragStart.snapshot; local.dragging = null; local.dragStart = null; canvas.style.cursor = 'default'; }
    else if (local.band) local.band = null;
    else if (local.selected.size) local.selected = new Set();
    else if (local.pseudo) { local.pseudo = null; local.decisionKey = null; onNewState(); }
    render(); updateMoveExtra(); return;
  }
  if (!S) return;
  if (e.key === 'r' || e.key === 'R') { if (isPlacing()) { e.preventDefault(); rotateSelection(e.shiftKey ? -1 : 1); } return; }
  if (e.key === 'i' || e.key === 'I') { if (local.hover) showDetails(local.hover.u.id); return; }
  if (!humanTurn()) return;
  if ((e.key === 'Enter' || (e.key === ' ' && S.pending.kind === 'observe')) && document.activeElement.tagName !== 'BUTTON') { if (clickKey('↵')) e.preventDefault(); return; }
  if (e.key === 's' || e.key === 'S') { clickKey('S'); return; }
  if (e.key === 'a' || e.key === 'A') { clickKey('A'); return; }
  if (e.key === 'e' || e.key === 'E') { clickKey('E'); return; }
  if (/^[1-9]$/.test(e.key) && S.pending.kind === 'stratagem') { clickKey(e.key); return; }
  if (e.key === 'n' || e.key === 'N' || e.key === 'Tab') { if (S.pending.kind === 'select_unit') { e.preventDefault(); nextUnit(); } }
});

  view.seenUndo = u.n;
  const mine = u.by === S.human_side;
  const who = mine ? 'Tu as annulé' : `${esc(u.name)} (${SIDE_FR[u.by]}) a annulé`;
  $('banner').innerHTML = `<button id="bannerclose" style="float:right">OK</button>${who} ${u.count} action${u.count > 1 ? 's' : ''} — retour à ${esc(u.where)}, avant « ${esc(u.first)} ». Les dés suivants seront nouveaux.`;
  $('banner').classList.add('open');
  $('bannerclose').onclick = () => $('banner').classList.remove('open');
  if (!mine) beep();
}
async function refreshHistory(force) {
  if (!view.historyOpen) return;
  const key = `${S.timeline}|${S.history_length}`;
  if (!force && key === view.historyKey) { renderHistory(); return; }
  view.historyKey = key;
  const res = await getJSON(withT(API + '/history'));
  view.history = res.history || [];
  renderHistory();
}
function renderHistory() {
  const box = $('history');
  const rows = view.history.slice().reverse().map(h => {
    const side = h.side === 'attacker' ? 'att' : 'def';
    const where = h.round ? `R${h.round} · ${PHASE_FR[h.phase] || h.phase}` : (PHASE_FR[h.phase] || h.phase);
    const btnHtml = S.human_side ? `<button data-to="${h.i}" class="${view.confirmAt === h.i ? 'confirm' : ''}">${view.confirmAt === h.i ? 'confirmer ?' : 'revenir avant'}</button>` : '';
    return `<div class="h"><span class="i">${h.i + 1}</span><span class="w">${esc(where)}</span><span class="l ${side} ${h.by === 'bot' ? 'bot' : ''} ${h.by === 'auto' ? 'auto' : ''}">${esc(h.label)}${h.by === 'auto' ? ' (auto)' : ''}</span>${btnHtml}</div>`;
  }).join('');
  box.innerHTML = `<div class="head"><span>Historique — ${view.history.length} action(s), la plus récente en haut</span><span><button id="histreplay">Rejouer les 30 dernières</button> <button id="histclose">Fermer</button></span></div>`
    + (S.human_side ? '<div style="color:var(--muted);margin-bottom:4px">« revenir avant » annule cette action et toutes les suivantes (les deux joueurs le voient) ; les dés d’après seront nouveaux.</div>' : '')
    + (rows || '<div style="color:var(--muted)">Aucune action pour l’instant.</div>');
  $('histclose').onclick = () => { view.historyOpen = false; box.classList.remove('open'); };
  $('histreplay').onclick = () => startReplay(Math.max(0, view.history.length - 30));
  box.querySelectorAll('button[data-to]').forEach(b => b.onclick = () => {
    const to = +b.dataset.to;
    if (view.confirmAt === to) undo(to);
    else { view.confirmAt = to; renderHistory(); }
  });
}
$('histbtn').addEventListener('click', () => {
  view.historyOpen = !view.historyOpen;
  $('history').classList.toggle('open', view.historyOpen);
  view.confirmAt = null;
  if (view.historyOpen) refreshHistory(true);
  $('log').scrollTop = $('log').scrollHeight;
});
$('undobtn').addEventListener('click', () => undo());
function rememberGame() {
  if (!TOKEN || !S.human_side) return;
  try {
    const all = JSON.parse(localStorage.getItem('fortyk.mygames') || '[]');
    const link = location.pathname + location.search;
    const item = { id: GID, side: S.human_side, link, title: (S.game && S.game.title) || GID, seen: new Date().toISOString() };
    localStorage.setItem('fortyk.mygames', JSON.stringify([item, ...all.filter(g => !(g.id === GID && g.side === S.human_side))].slice(0, 100)));
  } catch (e) { /* stockage indisponible : sans conséquence */ }
}

window.__fortykView = () => ({ margin, K: scale * zoom, panX, panY, zoom });  // lecture seule (tests, débogage)
window.addEventListener('resize', fit);
$('unitinfo').innerHTML = HELP;
(async () => {
  const lay = await getJSON(API + '/layout');
  if (lay.ok === false) { gameGone(lay); return; }
  layout = lay; fit(); poll();
})();
})();
</script>
