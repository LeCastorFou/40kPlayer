name: Dokploy (test) — créer / déployer 40kPlayer

# Lancé à la main (onglet Actions → « Run workflow »). Crée si besoin le projet et l'application
# sur l'instance Dokploy de test, les configure (Dockerfile, volume /data, domaine, code d'accès)
# et déploie. Idempotent. Ensuite, Dokploy redéploie tout seul à chaque push sur main.
# Secrets du dépôt : DOKPLOY_URL, DOKPLOY_API_KEY, FORTYK_ACCESS_CODE.

on:
  workflow_dispatch:
    inputs:
      project:
        description: "Projet Dokploy"
        default: "other"
        required: false
      app:
        description: "Nom de l'application"
        default: "40kplayer"
        required: false
      domain:
        description: "Nom d'hôte (DNS vers le serveur) ; vide = domaine traefik.me généré"
        default: ""
        required: false
      deploy:
        description: "Déployer après la configuration"
        type: boolean
        default: true

jobs:
  dokploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Joignabilité de l'instance Dokploy
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
        run: |
          code=$(curl -sSL -m 20 -o /dev/null -w '%{http_code}' -H "x-api-key: $DOKPLOY_API_KEY" "$DOKPLOY_URL/api/project.all" || echo 000)
          echo "project.all -> HTTP $code"
          [ "$code" = "200" ] || { echo "::error::instance Dokploy injoignable ou clé refusée depuis les runners GitHub (HTTP $code)"; exit 1; }

      - name: Créer / configurer / déployer
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          FORTYK_ACCESS_CODE: ${{ secrets.FORTYK_ACCESS_CODE }}
          IN_PROJECT: ${{ inputs.project }}
          IN_APP: ${{ inputs.app }}
          IN_DOMAIN: ${{ inputs.domain }}
          IN_DEPLOY: ${{ inputs.deploy }}
        run: |
          extra=""
          [ "$IN_DEPLOY" = "true" ] || extra="--no-deploy"
          python3 scripts/dokploy_setup.py --project "$IN_PROJECT" --app "$IN_APP" --domain "$IN_DOMAIN" $extra
